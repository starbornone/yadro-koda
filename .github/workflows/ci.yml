name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json#packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check
      - run: pnpm test
      - run: pnpm build

  # The schema's policies, triggers and RPCs against a real database, in transactions that are
  # rolled back. Runs only where the DATABASE_URL secret is set (forks and PRs from forks skip it).
  database:
    name: Schema tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.HAS_DATABASE_URL == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
