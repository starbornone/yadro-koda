name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json#packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check
      - run: pnpm test
      - run: pnpm build

  # The schema's policies, triggers and RPCs against a real database, in transactions that are
  # rolled back. Runs only where the DATABASE_URL secret is set (forks and PRs from forks skip it).
  database:
    name: Schema tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.HAS_DATABASE_URL == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # The app in a real browser against the live project, as throwaway users the suite creates
  # and deletes itself. Runs only where the three secrets are set (see README → Testing).
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.HAS_SUPABASE_KEY == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Traces and screenshots of whatever failed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
